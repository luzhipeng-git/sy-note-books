name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. 版本注入（从 tag 提取版本号；workflow_dispatch 时跳过，保留默认版本）
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" tauri.conf.json
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" core/Cargo.toml
          rm -f tauri.conf.json.bak Cargo.toml.bak core/Cargo.toml.bak

      # 3. 环境准备
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }

      # 4. Linux 系统依赖
      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 4.5 Ensure chmcmd binary exists for this platform
      # Windows + Linux binaries are committed in src-tauri/binaries/
      # macOS binary is installed via Homebrew (not committed due to size)
      - name: Install chmcmd (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install freepascal 2>/dev/null || true
          FPC_BIN=$(find /usr/local /opt/homebrew -name "chmcmd" -type f 2>/dev/null | head -1)
          TARGET="${{ matrix.target }}"
          if [ -n "$FPC_BIN" ]; then
            cp "$FPC_BIN" "src-tauri/binaries/chmcmd-${TARGET}"
            chmod +x "src-tauri/binaries/chmcmd-${TARGET}"
          else
            echo "::warning::chmcmd not found — CHM export will generate project files only"
            mkdir -p src-tauri/binaries
            touch "src-tauri/binaries/chmcmd-${TARGET}"
          fi

      # 5. 前端依赖
      - run: pnpm install --frozen-lockfile

      # 5.5 预验证前端构建
      - run: pnpm build
        env:
          ROLLDOWN_LOG: error

      # 6. 构建 Tauri + 发布
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '书昀笔记电子书 ${{ github.ref_name }}'
          releaseBody: |
            ## 书昀笔记电子书 ${{ github.ref_name }}

            ### 下载
            - **Windows**: NSIS 安装包 (`.exe`)
            - **macOS (Apple Silicon)**: DMG
            - **macOS (Intel)**: DMG
            - **Linux**: AppImage + deb

            > Windows 首次安装会自动下载 WebView2 运行时。
            > macOS 未签名，安装时需右键 → 打开。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
