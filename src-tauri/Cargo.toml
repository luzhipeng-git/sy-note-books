[workspace]
members = ["core", "."]
resolver = "2"

[package]
name = "sy-note-books"
version = "0.1.0"
edition = "2021"

[lib]
name = "sy_note_books_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sy-note-books-core = { path = "core" }

# Vendored patch: genpdf-chinese 0.2.9 (unmaintained) fails to compile on Rust
# 1.96+ due to a blanket-impl coherence conflict with the `time` crate. The
# vendored copy under vendor/genpdf-chinese replaces it with concrete impls.
[patch.crates-io]
genpdf-chinese = { path = "vendor/genpdf-chinese" }
