<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C6BC0"/>
      <stop offset="100%" style="stop-color:#7E57C2"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F5F5F5"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FAFAFA"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1A237E" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FFB300" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>

  <!-- 太阳光晕（右上角，昀=日光） -->
  <g filter="url(#glow)" transform="translate(810, 170)">
    <circle cx="0" cy="0" r="50" fill="#FFD54F"/>
    <circle cx="0" cy="0" r="35" fill="#FFEE58"/>
    <line x1="0" y1="-68" x2="0" y2="-88" stroke="#FFD54F" stroke-width="9" stroke-linecap="round"/>
    <line x1="48" y1="-48" x2="62" y2="-62" stroke="#FFD54F" stroke-width="9" stroke-linecap="round"/>
    <line x1="68" y1="0" x2="88" y2="0" stroke="#FFD54F" stroke-width="9" stroke-linecap="round"/>
    <line x1="48" y1="48" x2="62" y2="62" stroke="#FFD54F" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <line x1="-48" y1="-48" x2="-62" y2="-62" stroke="#FFD54F" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
    <line x1="-68" y1="0" x2="-88" y2="0" stroke="#FFD54F" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 书本主体（简化矩形） -->
  <g filter="url(#shadow)">
    <!-- 左页 -->
    <rect x="120" y="240" width="370" height="500" rx="8" fill="url(#leftPage)" stroke="#E0E0E0" stroke-width="2"/>
    <!-- 右页 -->
    <rect x="534" y="240" width="370" height="500" rx="8" fill="url(#rightPage)" stroke="#E0E0E0" stroke-width="2"/>
    <!-- 书脊 -->
    <rect x="490" y="240" width="44" height="500" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="1"/>
  </g>

  <!-- 左页：文字行 -->
  <rect x="148" y="275" width="180" height="13" rx="6" fill="#7986CB" opacity="0.8"/>
  <rect x="148" y="308" width="310" height="9" rx="4" fill="#B0BEC5" opacity="0.6"/>
  <rect x="148" y="332" width="270" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="356" width="300" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="380" width="240" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="416" width="150" height="11" rx="5" fill="#9575CD" opacity="0.7"/>
  <rect x="148" y="444" width="310" height="9" rx="4" fill="#B0BEC5" opacity="0.6"/>
  <rect x="148" y="468" width="280" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="492" width="320" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="516" width="250" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="540" width="290" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="564" width="200" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="588" width="310" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="612" width="260" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="636" width="300" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="660" width="230" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="148" y="684" width="280" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>

  <!-- 右页：代码块 -->
  <rect x="560" y="268" width="318" height="160" rx="10" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="2"/>
  <rect x="560" y="268" width="40" height="160" rx="10" fill="#C5CAE9" opacity="0.4"/>
  <rect x="572" y="290" width="16" height="7" rx="3" fill="#9FA8DA" opacity="0.7"/>
  <rect x="572" y="318" width="16" height="7" rx="3" fill="#9FA8DA" opacity="0.7"/>
  <rect x="572" y="346" width="16" height="7" rx="3" fill="#9FA8DA" opacity="0.7"/>
  <rect x="572" y="374" width="16" height="7" rx="3" fill="#9FA8DA" opacity="0.7"/>
  <rect x="572" y="402" width="16" height="7" rx="3" fill="#9FA8DA" opacity="0.7"/>
  <!-- 代码内容行 -->
  <rect x="610" y="286" width="60" height="8" rx="4" fill="#7E57C2" opacity="0.8"/>
  <rect x="676" y="286" width="100" height="8" rx="4" fill="#9FA8DA" opacity="0.5"/>
  <rect x="610" y="314" width="50" height="8" rx="4" fill="#42A5F5" opacity="0.8"/>
  <rect x="666" y="314" width="90" height="8" rx="4" fill="#90CAF9" opacity="0.5"/>
  <rect x="625" y="342" width="130" height="8" rx="4" fill="#66BB6A" opacity="0.8"/>
  <rect x="610" y="370" width="70" height="8" rx="4" fill="#FFA726" opacity="0.8"/>
  <rect x="686" y="370" width="80" height="8" rx="4" fill="#90CAF9" opacity="0.5"/>
  <rect x="610" y="398" width="110" height="8" rx="4" fill="#BDBDBD" opacity="0.6"/>

  <!-- 右页下方文字 -->
  <rect x="560" y="455" width="300" height="9" rx="4" fill="#B0BEC5" opacity="0.6"/>
  <rect x="560" y="479" width="270" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="503" width="310" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="527" width="240" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="551" width="290" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="575" width="260" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="599" width="310" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="623" width="220" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="647" width="280" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>
  <rect x="560" y="671" width="200" height="9" rx="4" fill="#CFD8DC" opacity="0.5"/>

  <!-- 「书昀」文字（书本下方居中） -->
  <text x="512" y="870" text-anchor="middle"
        font-family="'Noto Sans CJK SC Black', 'Noto Sans CJK SC Medium', 'Noto Sans CJK SC', sans-serif"
        font-size="120" font-weight="900" fill="#FFFFFF" letter-spacing="16">书昀</text>
</svg>
