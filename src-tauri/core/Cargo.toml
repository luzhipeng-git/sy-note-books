[package]
name = "sy-note-books-core"
version = "0.3.3"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.11"
percent-encoding = "2"
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
encoding_rs = "0.8"
base64 = "0.22"
ironpress = { version = "1.4", default-features = false }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
